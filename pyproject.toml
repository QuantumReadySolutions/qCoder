[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcoder"
version = "0.6.0a21"
description = "Quantum circuit analysis and structured feature extraction tools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Quantum Ready Solutions", email = "support@qcoder.ai" },
]
maintainers = [
    { name = "Quantum Ready Solutions", email = "support@qcoder.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["numpy"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
cirq = ["cirq-core>=1.4"]
pennylane = ["pennylane>=0.44"]

[project.urls]
Homepage = "https://qcoder.ai"
Documentation = "https://qcoder.ai/manual/"
Repository = "https://github.com/QuantumReadySolutions/qCoder"
Issues = "https://github.com/QuantumReadySolutions/qCoder/issues"

[project.scripts]
qcoder = "qcoder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["qcoder.pro_v0", "qcoder.pro_v0.*"]

[tool.setuptools.package-data]
qcoder = ["model_packs/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/qcoder/core/context.py" = ["F401"]
"src/qcoder/engines/feature_extraction/reps/cut_profile.py" = ["F401"]
"tests/test_guidance_model_pack.py" = ["F401"]
