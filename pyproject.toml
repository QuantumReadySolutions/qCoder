[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcoder"
version = "0.6.0a24.post0.dev2+openqasm3.local.evidence.v1"
description = "Quantum circuit analysis and structured feature extraction tools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Quantum Ready Solutions", email = "support@qcoder.ai" },
]
maintainers = [
    { name = "Quantum Ready Solutions", email = "support@qcoder.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["numpy"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
cirq = ["cirq-core>=1.4"]
pennylane = ["pennylane>=0.44"]

[project.urls]
Homepage = "https://qcoder.ai"
Documentation = "https://qcoder.ai/manual/"
Repository = "https://github.com/QuantumReadySolutions/qCoder"
Issues = "https://github.com/QuantumReadySolutions/qCoder/issues"

[project.scripts]
qcoder = "qcoder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "qcoder",
    "qcoder.contracts",
    "qcoder.core",
    "qcoder.core.qasm2",
    "qcoder.engines.context",
    "qcoder.engines.feature_extraction",
    "qcoder.engines.feature_extraction.adapters",
    "qcoder.engines.feature_extraction.features",
    "qcoder.engines.feature_extraction.parsers",
    "qcoder.engines.feature_extraction.reps",
    "qcoder.engines.guidance",
    "qcoder.engines.profiles",
    "qcoder.engines.review",
    "qcoder.explorer",
    "qcoder.model_packs",
    "qcoder.pipelines",
    "qcoder.pro_preview",
    "qcoder.tools",
]

[tool.setuptools.package-data]
qcoder = [
    "contracts/protected_decision_contract_v1.json",
    "model_packs/resource_guidance_local_v0.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/qcoder/core/context.py" = ["F401"]
"src/qcoder/engines/feature_extraction/reps/cut_profile.py" = ["F401"]
"tests/test_guidance_model_pack.py" = ["F401"]
